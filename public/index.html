<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Музыкальные игры — пульт</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="controller">
    <main class="phone">
      <h1>Музыкальные игры</h1>
      <div class="subtitle">Пульт участника</div>

      <form id="join">
        <label>
          Код партии
          <input id="code" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="ABCD" />
        </label>
        <label>
          Твоё имя
          <input id="name" maxlength="24" autocomplete="off" placeholder="Например, Маша" />
        </label>
        <button class="primary" type="submit">Войти</button>
      </form>

      <div id="error" class="error"></div>

      <div id="waiting" class="waiting hidden">
        <div class="big">Ты в игре!</div>
        <div id="me"></div>
        <div class="subtitle">Жди, пока ведущий начнёт эксперимент.</div>
      </div>
    </main>

    <script>
      const el = (id) => document.getElementById(id);
      const wsUrl = (role) =>
        (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/ws?role=' + role;

      const params = new URLSearchParams(location.search);
      if (params.get('code')) el('code').value = params.get('code').toUpperCase();

      let ws = null;

      function ensureSocket() {
        if (ws) return ws;
        ws = new WebSocket(wsUrl('controller'));
        ws.onmessage = onMessage;
        ws.onclose = () => {
          ws = null;
        };
        return ws;
      }

      el('join').addEventListener('submit', (e) => {
        e.preventDefault();
        el('error').textContent = '';
        const name = el('name').value.trim();
        const code = el('code').value.trim().toUpperCase();
        if (!name) {
          el('error').textContent = 'Введите имя';
          return;
        }
        const socket = ensureSocket();
        const send = () => socket.send(JSON.stringify({ type: 'join', name, code }));
        if (socket.readyState === WebSocket.OPEN) send();
        else socket.addEventListener('open', send, { once: true });
      });

      function onMessage(e) {
        const m = JSON.parse(e.data);
        if (m.type === 'joined') {
          el('join').classList.add('hidden');
          el('waiting').classList.remove('hidden');
          el('me').textContent = m.name;
        } else if (m.type === 'error') {
          el('error').textContent = m.message;
        } else if (m.type === 'kicked') {
          el('waiting').classList.add('hidden');
          el('join').classList.remove('hidden');
          el('error').textContent = 'Вас убрали из партии';
        }
      }
    </script>
  </body>
</html>
