<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Музыкальные игры — пульт</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="controller">
    <main class="phone">
      <h1>Музыкальные игры</h1>
      <div class="subtitle">Пульт участника</div>

      <form id="join">
        <label>
          Код партии
          <input id="code" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="SOUZ" />
        </label>
        <label>
          Твоё имя
          <input id="name" maxlength="24" autocomplete="off" placeholder="Например, Маша" />
        </label>
        <button class="primary" type="submit">Войти</button>
      </form>

      <div id="error" class="error"></div>
      <div id="stage"></div>
    </main>

    <script type="module">
      import { el, esc, connect, send, drawStroke, redrawCanvas } from '/client.js';

      const params = new URLSearchParams(location.search);
      if (params.get('code')) el('code').value = params.get('code').toUpperCase();

      let me = null;
      let lastState = null;
      let submittedRound = -1;
      let drawerCanvas = null;
      let drawRenderKey = null;

      const ws = connect('controller', {
        joined: (m) => {
          me = m.participantId;
          localStorage.setItem('souz-id', m.participantId);
          el('error').textContent = '';
        },
        state: (m) => {
          lastState = m;
          render(m);
        },
        error: (m) => {
          el('error').textContent = m.message || '';
        },
        kicked: () => {
          me = null;
          submittedRound = -1;
          localStorage.removeItem('souz-id');
          el('join').classList.remove('hidden');
          el('stage').innerHTML = '';
          el('error').textContent = 'Вас убрали из партии';
        },
        'answer-accepted': () => {
          if (lastState && lastState.round) {
            submittedRound = lastState.round.index;
            render(lastState);
          }
        },
        canvas: (m) => {
          if (drawerCanvas) redrawCanvas(drawerCanvas, m.strokes);
        },
      });

      const savedId = localStorage.getItem('souz-id');
      if (savedId) send(ws, { type: 'rejoin', participantId: savedId });

      el('join').addEventListener('submit', (event) => {
        event.preventDefault();
        const name = el('name').value.trim();
        const code = el('code').value.trim().toUpperCase();
        if (!name) {
          el('error').textContent = 'Введите имя';
          return;
        }
        el('error').textContent = '';
        send(ws, { type: 'join', name, code });
      });

      document.addEventListener('click', (event) => {
        const button = event.target.closest('[data-option]');
        if (!button) return;
        if (lastState && lastState.round && submittedRound === lastState.round.index) return;
        send(ws, { type: 'submit-answer', value: button.dataset.option });
      });

      function setupDrawer(canvas, socket, strokes) {
        drawerCanvas = canvas;
        redrawCanvas(canvas, strokes);
        const ctx = canvas.getContext('2d');
        let drawing = false;
        let last = null;
        const pos = (event) => {
          const rect = canvas.getBoundingClientRect();
          return {
            x: (event.clientX - rect.left) / rect.width,
            y: (event.clientY - rect.top) / rect.height,
          };
        };
        canvas.addEventListener('pointerdown', (event) => {
          drawing = true;
          last = pos(event);
          canvas.setPointerCapture(event.pointerId);
        });
        canvas.addEventListener('pointermove', (event) => {
          if (!drawing || !last) return;
          const p = pos(event);
          const stroke = { x0: last.x, y0: last.y, x1: p.x, y1: p.y };
          drawStroke(ctx, canvas, stroke);
          send(socket, { type: 'draw', stroke });
          last = p;
        });
        const stop = () => {
          drawing = false;
          last = null;
        };
        canvas.addEventListener('pointerup', stop);
        canvas.addEventListener('pointercancel', stop);
        el('clear-canvas').addEventListener('click', () => send(socket, { type: 'clear-canvas' }));
        el('undo-draw').addEventListener('click', () => send(socket, { type: 'undo-draw' }));
      }

      function render(m) {        const join = el('join');
        const stage = el('stage');

        if (!me) {
          join.classList.remove('hidden');
          stage.innerHTML = '';
          return;
        }

        const p = m.participants.find((x) => x.id === me);
        if (!p) {
          me = null;
          join.classList.remove('hidden');
          stage.innerHTML = '';
          return;
        }
        join.classList.add('hidden');

        if (m.phase === 'lobby' || m.phase === 'experiment') {
          stage.innerHTML = `<div class="waiting">
            <div class="big">Ты в игре!</div>
            <div id="me">${esc(p.name)}</div>
            <div class="subtitle">Жди, пока ведущий запустит раунд.</div>
          </div>`;
          return;
        }

        if (m.phase === 'round') {
          const isDrawing = m.experiment && m.experiment.kind === 'drawing';
          const isDrawer = isDrawing && m.drawerId === me;
          if (isDrawer) {
            const key = 'draw:' + m.round.index;
            if (key === drawRenderKey && el('draw-canvas')) return;
            drawRenderKey = key;
            stage.innerHTML = `
              <div class="draw-phone">
                <div class="hint">Нарисуй песню</div>
                <canvas id="draw-canvas" width="900" height="620"></canvas>
                <div class="btn-row">
                  <button class="secondary" id="clear-canvas">Очистить</button>
                  <button class="secondary" id="undo-draw">Отменить</button>
                </div>
              </div>`;
            setupDrawer(el('draw-canvas'), ws, m.drawing);
            return;
          }
          drawRenderKey = null;
          const submitted = submittedRound === m.round.index;
          const options = m.round.data.options;
          const picture = m.round.data.image
            ? `<div class="collage small phone-collage"><img src="${esc(m.round.data.image)}" alt="Коллаж" /></div>`
            : m.round.data.prompt
              ? ''
              : '<div class="hint">Смотрите на общий экран</div>';
          const answerArea = submitted
            ? '<div class="accepted">Ответ принят</div>'
            : options
              ? `<div class="options">${options
                  .map((o) => `<button class="option" data-option="${esc(o)}">${esc(o)}</button>`)
                  .join('')}</div>`
              : `<form id="answer-form">
                   <label>Твой ответ<input id="answer" maxlength="60" autocomplete="off" placeholder="Название песни" /></label>
                   <button class="primary" type="submit">Ответить</button>
                 </form>`;
          const prompt = m.round.data.prompt ? `<div class="round-prompt">${esc(m.round.data.prompt)}</div>` : '';
          stage.innerHTML = `<div class="round-phone">${prompt}${
            isDrawing ? '<div class="hint">Угадайте песню по рисунку</div>' : picture
          }${answerArea}</div>`;
          if (!submitted && !options) {
            el('answer-form').addEventListener('submit', (event) => {
              event.preventDefault();
              const value = el('answer').value.trim();
              if (!value) return;
              send(ws, { type: 'submit-answer', value });
            });
          }
          return;
        }

        if (m.phase === 'reveal') {
          const r = m.reveal.results.find((x) => x.participantId === me);
          const ok = !!(r && r.correct);
          stage.innerHTML = `<div class="waiting">
            <div class="big ${ok ? 'ok' : 'no'}">${ok ? 'Верно!' : 'Неверно'}</div>
            <div class="subtitle">Правильный ответ</div>
            <div class="answer-small">${esc(m.reveal.answer)}</div>
            <div class="subtitle">${ok ? '+' + r.points + ' балл(а)' : 'Ждём следующий раунд'}</div>
          </div>`;
          return;
        }

        if (m.phase === 'results') {
          const sorted = [...m.participants].sort((a, b) => b.score - a.score);
          const rank = sorted.findIndex((x) => x.id === me) + 1;
          stage.innerHTML = `<div class="waiting">
            <div class="big">Итоги</div>
            <div id="me">${esc(p.name)}: ${p.score} балл(ов)</div>
            <div class="subtitle">Место ${rank} из ${sorted.length}</div>
          </div>`;
        }

        if (m.phase === 'winner') {
          const w = m.winner;
          stage.innerHTML = `<div class="waiting">
            <div class="big">Победитель</div>
            <div id="me">${esc(w ? w.name : '—')}</div>
            <div class="subtitle">${w ? w.score + ' балл(ов)' : ''}</div>
          </div>`;
        }
      }
    </script>
  </body>
</html>
