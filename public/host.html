<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Музыкальные игры — экран ведущего</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="wide">
    <header class="brand">
      <span class="dot"></span>
      <h1>Экран ведущего</h1>
      <button class="secondary lobby-return hidden" id="to-lobby" type="button">В лобби</button>
    </header>

    <main id="stage" class="stage" aria-live="polite"></main>
    <canvas id="draw-canvas" class="draw-canvas hidden" width="900" height="620"></canvas>

    <div id="media-bar" class="media-bar hidden" role="region" aria-label="Управление медиа"></div>

    <script type="module">
      import { el, esc, connect, send, loadConfig, drawStroke, redrawCanvas } from '/client.js';

      let joinUrl = '';
      let state = null;
      let progress = null;
      let progressMediaId = null;
      let pendingSeek = null;
      let draggingSeek = false;

      loadConfig().then((cfg) => {
        joinUrl = cfg.joinUrl;
        if (state) render(state);
      });

      const ws = connect('host', {
        state: (m) => {
          state = m;
          const media = m.media;
          if (!media || !media.hint) {
            progress = null;
            progressMediaId = null;
            pendingSeek = null;
          } else if (media.id !== progressMediaId) {
            progressMediaId = media.id;
            progress = media.progress || null;
            pendingSeek = null;
          } else if (pendingSeek == null && media.progress) {
            progress = media.progress;
          }
          render(m);
          renderMediaBar(m);
          updateHintSeek();
        },
        'media-progress': (m) => {
          if (pendingSeek != null && Math.abs(m.currentTime - pendingSeek) < 1.5) pendingSeek = null;
          if (pendingSeek == null) {
            progress = { currentTime: m.currentTime, duration: m.duration };
          }
          updateHintSeek();
        },
        error: (m) => {
          if (m && m.message) console.warn('host error:', m.message);
        },
        draw: (m) => {
          const canvas = el('draw-canvas');
          if (!canvas.classList.contains('hidden')) drawStroke(canvas.getContext('2d'), canvas, m.stroke);
        },
        canvas: (m) => {
          redrawCanvas(el('draw-canvas'), m.strokes);
        },
      });

      document.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;
        if (button.dataset.mode) {
          send(ws, { type: 'set-mode', mode: button.dataset.mode });
        } else if (button.dataset.speed) {
          send(ws, { type: 'set-speed-bonus', enabled: button.dataset.speed === 'on' });
        } else if (button.dataset.kick) {
          send(ws, { type: 'kick', participantId: button.dataset.kick });
        } else if (button.dataset.exp) {
          send(ws, { type: 'start-experiment', experimentId: button.dataset.exp });
        } else if (button.dataset.episode) {
          send(ws, { type: 'select-episode', episodeId: button.dataset.episode });
        } else if (button.dataset.drawer) {
          send(ws, { type: 'set-drawer', participantId: button.dataset.drawer });
        } else if (button.id === 'start-round') {
          send(ws, { type: 'start-round' });
        } else if (button.id === 'reveal-hint') {
          send(ws, { type: 'reveal-hint' });
        } else if (button.dataset.score) {
          send(ws, {
            type: 'adjust-score',
            participantId: button.dataset.score,
            delta: Number(button.dataset.delta),
          });
        } else if (button.dataset.media) {
          send(ws, { type: 'media-control', action: button.dataset.media });
        } else if (button.dataset.hint) {
          send(ws, { type: 'play-hint', variant: button.dataset.hint });
        } else if (button.id === 'reveal') {
          send(ws, { type: 'reveal' });
        } else if (button.id === 'next-round') {
          send(ws, { type: 'next-round' });
        } else if (button.id === 'back-lobby') {
          send(ws, { type: 'back-to-lobby' });
        } else if (button.id === 'to-lobby') {
          send(ws, { type: 'back-to-lobby' });
        } else if (button.id === 'finish-party') {
          send(ws, { type: 'finish-party' });
        }
      });

      const stageEl = el('stage');
      stageEl.addEventListener('input', (event) => {
        if (event.target.id !== 'hint-seek') return;
        draggingSeek = true;
        const max = Number(event.target.max) || 0;
        const pct = max ? (Number(event.target.value) / max) * 100 : 0;
        event.target.style.setProperty('--seek-progress', `${pct}%`);
        const current = el('hint-current');
        if (current) current.textContent = fmtTime(Number(event.target.value));
      });
      stageEl.addEventListener('change', (event) => {
        if (event.target.id !== 'hint-seek') return;
        draggingSeek = false;
        const seconds = Number(event.target.value);
        pendingSeek = seconds;
        progress = { currentTime: seconds, duration: progress ? progress.duration : 0 };
        updateHintSeek();
        send(ws, { type: 'media-seek', seconds });
      });

      function fmtTime(value) {
        const total = Math.max(0, Math.floor(Number(value) || 0));
        return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
      }

      const modeButton = (mode, label, active) =>
        `<button data-mode="${mode}" class="${active ? 'active' : ''}">${label}</button>`;

      function roundsLabel(n) {
        const mod10 = n % 10;
        const mod100 = n % 100;
        const word =
          mod10 === 1 && mod100 !== 11
            ? 'раунд'
            : mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)
              ? 'раунда'
              : 'раундов';
        return `${n} ${word}`;
      }

      function episodePicker(m) {
        const seasons = [...new Set(m.episodes.map((e) => e.season))].sort((a, b) => a - b);
        const current = m.episode ? m.episode.title : 'Не выбран';
        return `
          <div class="episode-head">
            <span class="label">Выпуск</span>
            <b class="episode-current">${esc(current)}</b>
          </div>
          ${seasons
            .map(
              (season) => `
              <div class="season-block">
                <div class="season-title">${season === 0 ? 'Свои выпуски' : `Сезон ${season}`}</div>
                <div class="episode-list">
                  ${m.episodes
                    .filter((e) => e.season === season)
                    .sort((a, b) => a.number - b.number)
                    .map(
                      (e) =>
                        `<button data-episode="${esc(e.id)}" class="${m.episode && m.episode.id === e.id ? 'active' : ''}">${
                          e.season === 0 ? 'Семейный' : `Выпуск ${e.number}`
                        }</button>`
                    )
                    .join('')}
                </div>
              </div>`
            )
            .join('')}`;
      }

      function drawerPicker(m) {
        return `
          <div class="drawer-picker">
            <div class="label">Кто рисует?</div>
            <div class="btn-row wrap">
              ${m.participants
                .map(
                  (p) =>
                    `<button data-drawer="${esc(p.id)}" class="${m.pendingDrawerId === p.id ? 'active' : ''}">${esc(p.name)}</button>`
                )
                .join('')}
            </div>
          </div>`;
      }

      function hostMemo(m) {
        const data = (m.round && m.round.data) || {};
        if (!data.answer && !data.hint) return '';
        return `
          <div class="host-memo">
            ${data.answer ? `<div class="memo-row"><span class="label">Ответ</span><b>${esc(data.answer)}</b></div>` : ''}
            ${data.hint ? `<div class="memo-row"><span class="label">Подсказка</span><span>${esc(data.hint)}</span></div>` : ''}
          </div>`;
      }

      function hintButton(m) {
        const data = (m.round && m.round.data) || {};
        if (!data.hint || m.hintRevealed) return '';
        return `<button class="secondary" id="reveal-hint">${data.hintAudio ? 'Текст на экран' : 'Показать подсказку'}</button>`;
      }

      function hintAudioBlock(m) {
        const audio = m.round && m.round.data && m.round.data.hintAudio;
        if (!audio) return '';
        const media = m.media && m.media.hint ? m.media : null;
        const active = media ? media.hintVariant : null;
        const playing = !!(media && media.playing);
        const variants = [
          ['instrumental', 'Без слов'],
          ['vocal', 'Со словами'],
        ].filter(([key]) => audio[key]);
        const duration = progress ? progress.duration : 0;
        const current = progress ? (duration ? Math.min(progress.currentTime, duration) : progress.currentTime) : 0;
        return `
          <div class="hint-audio" role="group" aria-labelledby="hint-audio-label">
            <div class="hint-audio-head">
              <span class="hint-audio-label" id="hint-audio-label">
                <span class="media-eq ${playing ? 'is-playing' : 'is-paused'}" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                Подсказка · аудио
              </span>
              <span class="hint-audio-state">${
                media
                  ? `${playing ? 'Играет' : 'Пауза'} · ${active === 'instrumental' ? 'без слов' : 'со словами'}`
                  : 'Включите вариант для зала'
              }</span>
            </div>
            <div class="hint-audio-row">
              ${variants
                .map(([key, label]) => {
                  const isActive = active === key;
                  return `<button class="hint-audio-btn${isActive ? ' is-active' : ''}" data-hint="${key}" aria-pressed="${isActive}">
                    ${isActive && playing ? ICON_PAUSE : ICON_PLAY}<span>${label}</span>
                  </button>`;
                })
                .join('')}
              ${media ? `<button class="hint-audio-stop" data-media="skip">${ICON_STOP}<span>Стоп</span></button>` : ''}
            </div>
            ${
              media
                ? `<div class="hint-seek">
                    <span class="hint-time" id="hint-current">${fmtTime(current)}</span>
                    <input id="hint-seek" type="range" min="0" max="${duration}" step="0.1" value="${current}" aria-label="Перемотка подсказки" ${duration ? '' : 'disabled'} />
                    <span class="hint-time" id="hint-total">${fmtTime(duration)}</span>
                  </div>`
                : ''
            }
          </div>`;
      }

      function updateHintSeek() {
        const slider = el('hint-seek');
        if (!slider) return;
        const duration = progress ? progress.duration : 0;
        const current = progress ? progress.currentTime : 0;
        slider.max = String(duration || 0);
        slider.disabled = !duration;
        if (!draggingSeek && pendingSeek == null) {
          slider.value = String(duration ? Math.min(current, duration) : current);
        }
        const shown = draggingSeek ? Number(slider.value) : current;
        const pct = duration ? Math.min(100, (shown / duration) * 100) : 0;
        slider.style.setProperty('--seek-progress', `${pct}%`);
        const currentLabel = el('hint-current');
        if (currentLabel) currentLabel.textContent = fmtTime(shown);
        const totalLabel = el('hint-total');
        if (totalLabel) totalLabel.textContent = fmtTime(duration);
      }

      function answerStatus(m) {
        if (!m.participants.length) return '';
        const answered = new Set(m.answeredIds || []);
        return `<ul class="answer-status">
          ${m.participants
            .map(
              (p) => `<li class="${answered.has(p.id) ? 'done' : ''}">
                <span>${esc(p.name)}</span>
                <b>${answered.has(p.id) ? 'ответил' : 'ждём'}</b>
              </li>`
            )
            .join('')}
        </ul>`;
      }

      const ICON_PLAY =
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6L19 12z" fill="currentColor"/></svg>';
      const ICON_PAUSE =
        '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.2" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2" fill="currentColor"/></svg>';
      const ICON_RESTART =
        '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10a7.8 7.8 0 1 1 2.1 6.6"/><path d="M4.2 4.8v5.4h5.4"/></svg>';
      const ICON_SKIP =
        '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5.5 14 12l-9 6.5z" fill="currentColor" stroke="none"/><path d="M17.5 5v14"/></svg>';
      const ICON_STOP =
        '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></svg>';

      function mediaLabel(media) {
        const raw = String((media && media.title) || '').trim();
        if (!raw) return 'Трек';
        if (!/\s/.test(raw) && raw.includes('-')) {
          return raw.replace(/-/g, ' ').replace(/^./, (c) => c.toUpperCase());
        }
        return raw;
      }

      function renderMediaBar(m) {
        const bar = el('media-bar');
        if (!m.media || m.media.hint || (m.phase !== 'round' && m.phase !== 'reveal')) {
          bar.classList.add('hidden');
          bar.innerHTML = '';
          return;
        }
        const playing = !!m.media.playing;
        bar.classList.remove('hidden');
        bar.innerHTML = `
          <div class="media-now">
            <span class="media-eq ${playing ? 'is-playing' : 'is-paused'}" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span class="media-meta">
              <span class="media-kicker">${playing ? 'Сейчас играет' : 'Пауза'}</span>
              <span class="media-bar-title">${esc(mediaLabel(m.media))}</span>
            </span>
          </div>
          <div class="media-actions">
            <button class="media-btn media-btn-primary" data-media="${playing ? 'pause' : 'play'}">
              ${playing ? ICON_PAUSE : ICON_PLAY}<span>${playing ? 'Пауза' : 'Продолжить'}</span>
            </button>
            <button class="media-btn" data-media="restart">
              ${ICON_RESTART}<span>Сначала</span>
            </button>
            <button class="media-btn media-btn-ghost" data-media="skip">
              ${ICON_SKIP}<span>Пропуск</span>
            </button>
          </div>`;
      }

      function render(m) {
        const stage = el('stage');
        const drawCanvas = el('draw-canvas');
        drawCanvas.classList.add('hidden');
        const lobbyReturn = el('to-lobby');
        if (lobbyReturn) lobbyReturn.classList.toggle('hidden', m.phase === 'lobby');

        if (m.phase === 'lobby') {
          stage.innerHTML = `
            <div class="deck">
              <div class="join-card card">
                <div class="label">Код для входа</div>
                <div class="code">${esc(m.code)}</div>
                <img class="qr" src="/api/qr.png" alt="QR-код для входа" />
                <div class="hint">Отсканируй QR или открой ${esc(joinUrl)}</div>
              </div>
              <div class="card">
                <div class="lobby-head">
                  <h2>Участники</h2>
                  <div class="mode-toggle">
                    ${modeButton('solo', 'Каждый сам за себя', m.mode === 'solo')}
                    ${modeButton('teams', 'Команды', m.mode === 'teams')}
                    <button data-speed="${m.speedBonus ? 'off' : 'on'}">Бонус за скорость: ${m.speedBonus ? 'вкл' : 'выкл'}</button>
                  </div>
                </div>
                <ul class="players host-list">
                  ${m.participants
                    .map(
                      (p) => `<li><span>${esc(p.name)}</span><button class="kick" data-kick="${esc(p.id)}">Убрать</button></li>`
                    )
                    .join('')}
                </ul>
                ${m.participants.length ? '' : '<div class="empty">Пока никого. Отсканируй QR с телефона.</div>'}
                <div class="episode-picker">${episodePicker(m)}</div>
                <div class="experiment-menu">
                  ${m.availableExperiments
                    .map(
                      (e) => `<button class="menu-item primary-exp" data-exp="${esc(e.id)}">
                        <span class="mi-name">Начать «${esc(e.name)}»</span>
                        <span class="mi-count">${roundsLabel(e.rounds)}</span>
                      </button>`
                    )
                    .join('')}
                </div>
              </div>
            </div>`;
          return;
        }

        if (m.phase === 'experiment') {
          const isDrawing = m.experiment && m.experiment.kind === 'drawing';
          stage.innerHTML = `
            <div class="card center-card">
              <div class="label">Эксперимент</div>
              <h2 class="experiment-name">${esc(m.experiment.name)}</h2>
              <p class="rules">${esc(m.experiment.rules)}</p>
              ${isDrawing ? drawerPicker(m) : ''}
              <div class="btn-row">
                <button class="primary" id="start-round">Начать раунд</button>
                <button class="secondary" id="back-lobby">Отмена</button>
              </div>
            </div>`;
          return;
        }

        if (m.phase === 'round') {
          if (m.experiment && m.experiment.kind === 'drawing') {
            drawCanvas.classList.remove('hidden');
            redrawCanvas(drawCanvas, m.drawing);
            stage.innerHTML = `
              <div class="card center-card">
                <div class="lobby-head">
                  <span class="pill">Раунд ${m.round.index + 1} / ${m.round.total}</span>
                  <span class="answers-count">Ответов: ${m.answersCount} из ${m.participants.length}</span>
                </div>
                <div class="hint">Рисунок на общем экране. Когда все угадали — раскройте ответ.</div>
                ${answerStatus(m)}
                ${hostMemo(m)}
                ${hintAudioBlock(m)}
                <div class="btn-row">${hintButton(m)}<button class="primary" id="reveal">Показать ответ</button></div>
              </div>`;
            return;
          }
          stage.innerHTML = `
            <div class="card center-card">
              <div class="lobby-head">
                <span class="pill">Раунд ${m.round.index + 1} / ${m.round.total}</span>
                <span class="answers-count">Ответов: ${m.answersCount} из ${m.participants.length}</span>
              </div>
              ${m.round.data.quote ? `<blockquote class="round-quote">«${esc(m.round.data.quote)}»</blockquote>` : ''}
              ${m.round.data.prompt ? `<h2 class="round-prompt">${esc(m.round.data.prompt)}</h2>` : ''}
              ${m.round.data.text ? `<p class="round-text">${esc(m.round.data.text)}</p>` : ''}
              <div class="collage small">
                ${m.round.data.image ? `<img src="${esc(m.round.data.image)}" alt="Коллаж" />` : '<div class="hint">Задание на общем экране</div>'}
              </div>
              ${answerStatus(m)}
              ${hostMemo(m)}
              ${hintAudioBlock(m)}
              <div class="btn-row">${hintButton(m)}<button class="primary" id="reveal">Показать ответ</button></div>
            </div>`;
          return;
        }

        if (m.phase === 'reveal') {
          const last = m.experiment.roundIndex + 1 >= m.experiment.totalRounds;
          stage.innerHTML = `
            <div class="card center-card">
              <div class="label">Правильный ответ</div>
              <h2 class="answer">${esc(m.reveal.answer)}</h2>
              <ul class="results">
                ${m.reveal.results
                  .map(
                    (r) => `<li class="result ${r.correct ? 'correct' : 'wrong'}">
                      <span class="rname">${esc(r.name)}</span>
                      <span class="rvalue">${r.value ? esc(r.value) : '—'}</span>
                      <span class="rpoints">${r.correct ? '+' + r.points : '0'}</span>
                    </li>`
                  )
                  .join('')}
              </ul>
              <div class="totals">
                ${m.participants
                  .map(
                    (p) => `<span class="total">
                      <span>${esc(p.name)}</span><b>${p.score}</b>
                      <span class="score-adj">
                        <button class="score-btn" data-score="${esc(p.id)}" data-delta="-1" aria-label="Минус один балл ${esc(p.name)}">−1</button>
                        <button class="score-btn" data-score="${esc(p.id)}" data-delta="1" aria-label="Плюс один балл ${esc(p.name)}">+1</button>
                      </span>
                    </span>`
                  )
                  .join('')}
              </div>
              <div class="btn-row">
                <button class="primary" id="next-round">${last ? 'Показать итоги' : 'Следующий раунд'}</button>
              </div>
            </div>`;
          return;
        }

        if (m.phase === 'winner') {
          const w = m.winner;
          stage.innerHTML = `
            <div class="card center-card">
              <div class="label">Победитель партии</div>
              <h2 class="answer">${esc(w ? w.name : '—')}</h2>
              <div class="hint">${w ? w.score + ' балл(ов)' : ''}</div>
              <div class="btn-row"><button class="primary" id="back-lobby">В лобби</button></div>
            </div>`;
          return;
        }

        if (m.phase === 'results') {
          const sorted = [...m.participants].sort((a, b) => b.score - a.score);
          stage.innerHTML = `
            <div class="card center-card">
              <div class="label">Итоги эксперимента</div>
              <ol class="standings">
                ${sorted
                  .map(
                    (p, i) => `<li>
                      <span class="pos">${i + 1}</span>
                      <span class="sname">${esc(p.name)}</span>
                      <span class="spoints">${p.score}</span>
                    </li>`
                  )
                  .join('')}
              </ol>
              <div class="btn-row"><button class="primary" id="back-lobby">В лобби</button><button class="secondary" id="finish-party">Завершить партию</button></div>
            </div>`;
        }
      }
    </script>
  </body>
</html>
