<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Музыкальные игры — экран ведущего</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="wide">
    <header class="brand">
      <span class="dot"></span>
      <h1>Экран ведущего</h1>
    </header>

    <main class="wide-grid">
      <section class="join-panel card">
        <div class="label">Код для входа</div>
        <div id="code" class="code">····</div>
        <img id="qr" class="qr" alt="QR-код для входа" />
        <div class="hint">Отсканируй QR или открой <span id="join-url">…</span></div>
      </section>

      <section class="lobby card">
        <div class="lobby-head">
          <h2>Участники</h2>
          <div class="mode-toggle" id="mode-toggle">
            <button data-mode="solo" class="active">Каждый сам за себя</button>
            <button data-mode="teams">Команды</button>
          </div>
        </div>
        <ul id="players" class="players host-list"></ul>
        <div id="empty" class="empty">Пока никого. Отсканируй QR с телефона.</div>
      </section>
    </main>

    <script>
      const el = (id) => document.getElementById(id);
      const wsUrl = (role) =>
        (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/ws?role=' + role;

      fetch('/api/config')
        .then((r) => r.json())
        .then((cfg) => {
          el('code').textContent = cfg.code;
          el('qr').src = cfg.qr;
          el('join-url').textContent = cfg.joinUrl;
        });

      const ws = new WebSocket(wsUrl('host'));
      ws.onmessage = (e) => {
        const m = JSON.parse(e.data);
        if (m.type === 'lobby') render(m);
      };

      el('mode-toggle').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-mode]');
        if (!btn) return;
        ws.send(JSON.stringify({ type: 'set-mode', mode: btn.dataset.mode }));
      });

      function render(m) {
        for (const btn of document.querySelectorAll('#mode-toggle button')) {
          btn.classList.toggle('active', btn.dataset.mode === m.mode);
        }
        const ul = el('players');
        ul.innerHTML = '';
        for (const p of m.participants) {
          const li = document.createElement('li');
          const name = document.createElement('span');
          name.textContent = p.name;
          const kick = document.createElement('button');
          kick.className = 'kick';
          kick.textContent = 'Убрать';
          kick.addEventListener('click', () =>
            ws.send(JSON.stringify({ type: 'kick', participantId: p.id }))
          );
          li.append(name, kick);
          ul.appendChild(li);
        }
        el('empty').style.display = m.participants.length ? 'none' : 'block';
      }
    </script>
  </body>
</html>
