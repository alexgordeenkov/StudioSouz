<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Музыкальные игры — общий экран</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="wide">
    <header class="brand">
      <span class="dot"></span>
      <h1>Музыкальные игры у Машеньки и Лёшика</h1>
    </header>

    <main class="wide-grid">
      <section class="join-panel card">
        <div class="label">Код для входа</div>
        <div id="code" class="code">····</div>
        <img id="qr" class="qr" alt="QR-код для входа" />
        <div class="hint">Отсканируй QR или открой <span id="join-url">…</span></div>
      </section>

      <section class="lobby card">
        <div class="lobby-head">
          <h2>В игре</h2>
          <span id="mode" class="pill">Каждый сам за себя</span>
        </div>
        <ul id="players" class="players"></ul>
        <div id="empty" class="empty">Пока никого. Отсканируй QR с телефона.</div>
      </section>
    </main>

    <script>
      const el = (id) => document.getElementById(id);
      const wsUrl = (role) =>
        (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/ws?role=' + role;

      fetch('/api/config')
        .then((r) => r.json())
        .then((cfg) => {
          el('code').textContent = cfg.code;
          el('qr').src = cfg.qr;
          el('join-url').textContent = cfg.joinUrl;
        });

      const ws = new WebSocket(wsUrl('screen'));
      ws.onmessage = (e) => {
        const m = JSON.parse(e.data);
        if (m.type === 'lobby') render(m);
      };

      function render(m) {
        el('mode').textContent = m.mode === 'teams' ? 'Команды' : 'Каждый сам за себя';
        const ul = el('players');
        ul.innerHTML = '';
        for (const p of m.participants) {
          const li = document.createElement('li');
          li.textContent = p.name;
          ul.appendChild(li);
        }
        el('empty').style.display = m.participants.length ? 'none' : 'block';
      }
    </script>
  </body>
</html>
