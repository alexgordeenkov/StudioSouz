<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Музыкальные игры — общий экран</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="wide screen">
    <header class="brand">
      <span class="dot"></span>
      <h1>Музыкальные игры у Машеньки и Лёшика</h1>
    </header>

    <main id="stage" class="stage" aria-live="polite"></main>
    <canvas id="draw-canvas" class="draw-canvas hidden" width="900" height="620"></canvas>
    <div id="media" class="media-layer"></div>
    <button id="sound-unlock" class="sound-unlock" type="button" autofocus tabindex="0">Включить звук</button>
    <div id="sound-status" class="sound-status hidden" role="status"></div>

    <script type="module">
      import { el, esc, connect, loadConfig, drawStroke, redrawCanvas } from '/client.js';

      let joinUrl = '';
      let state = null;

      loadConfig().then((cfg) => {
        joinUrl = cfg.joinUrl;
        if (state) render(state);
      });

      connect('screen', {
        state: (m) => {
          state = m;
          render(m);
          renderMedia(m);
        },
        draw: (m) => {
          const canvas = el('draw-canvas');
          if (!canvas.classList.contains('hidden')) drawStroke(canvas.getContext('2d'), canvas, m.stroke);
        },
        canvas: (m) => {
          redrawCanvas(el('draw-canvas'), m.strokes);
        },
      });

      let mediaKey = null;
      let ytFrame = null;
      let audioEl = null;
      let lastRestartToken = 0;
      let soundUnlocked = false;
      let soundStatusTimer = 0;

      const soundUnlock = el('sound-unlock');
      const soundStatus = el('sound-status');

      function showSoundUnlock(show) {
        soundUnlock.classList.toggle('hidden', !show);
      }

      function showSoundStatus(text) {
        soundStatus.textContent = text;
        soundStatus.classList.toggle('hidden', !text);
        window.clearTimeout(soundStatusTimer);
        if (text) soundStatusTimer = window.setTimeout(() => soundStatus.classList.add('hidden'), 5000);
      }

      function audioErrorText(error) {
        const name = error && error.name;
        if (name === 'NotAllowedError') return 'Браузер блокирует автоплей';
        if (name === 'NotSupportedError') return 'ТВ не поддерживает этот аудиоформат';
        if (name === 'NotReadableError' || name === 'NetworkError') return 'Не удалось загрузить аудио с ПК';
        return 'Ошибка аудио: ' + (name || 'unknown');
      }

      function playAudio() {
        if (!audioEl) return;
        const el = audioEl;
        if (soundUnlocked) {
          el.muted = false;
          el.volume = 1;
          el.play().catch((error) => {
            soundUnlocked = false;
            showSoundUnlock(true);
            showSoundStatus(audioErrorText(error));
          });
          return;
        }
        el.muted = true;
        el.volume = 1;
        const started = el.play();
        if (!started) return;
        started
          .then(() => {
            el.muted = false;
            window.setTimeout(() => {
              if (el.paused) {
                soundUnlocked = false;
                showSoundUnlock(true);
              } else {
                soundUnlocked = true;
              }
            }, 1200);
          })
          .catch((error) => {
            showSoundUnlock(true);
            showSoundStatus(audioErrorText(error));
          });
      }

      function unlockSound() {
        soundUnlocked = true;
        showSoundUnlock(false);
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) new Ctx().resume();
        } catch {
          // Web Audio не обязателен — ниже обычный play()
        }
        if (!audioEl) {
          showSoundStatus('Звук включён');
          return;
        }
        audioEl.muted = false;
        audioEl.volume = 1;
        audioEl
          .play()
          .then(() => showSoundStatus('Звук включён'))
          .catch((error) => {
            soundUnlocked = false;
            showSoundUnlock(true);
            showSoundStatus(audioErrorText(error));
          });
      }

      soundUnlock.addEventListener('click', unlockSound);
      soundUnlock.addEventListener('pointerup', unlockSound);
      soundUnlock.addEventListener('touchend', unlockSound);
      soundUnlock.addEventListener('keydown', (event) => {
        event.preventDefault();
        unlockSound();
      });
      document.addEventListener('pointerdown', unlockSound, { once: true });
      document.addEventListener('touchend', unlockSound, { once: true });
      document.addEventListener('keydown', unlockSound, { once: true });

      function promptOverlay(m) {
        const prompt = m.round && m.round.data && m.round.data.prompt;
        return prompt ? `<div class="media-prompt">${esc(prompt)}</div>` : '';
      }

      function renderMedia(m) {
        const layer = el('media');
        const media = m.media;
        if (!media) {
          layer.classList.remove('active', 'audio-only', 'reveal-audio');
          if (mediaKey) {
            layer.innerHTML = '';
            mediaKey = null;
            ytFrame = null;
            audioEl = null;
          }
          return;
        }
        layer.classList.add('active');
        layer.classList.toggle('audio-only', media.source === 'local');
        layer.classList.toggle('reveal-audio', !!media.reveal);
        const key = media.source + ':' + (media.youtubeId || media.localUrl) + (media.reveal ? ':reveal' : '');
        if (key !== mediaKey) {
          mediaKey = key;
          if (media.source === 'youtube') {
            layer.innerHTML = `<div class="media-frame"><iframe src="https://www.youtube.com/embed/${encodeURIComponent(
              media.youtubeId
            )}?autoplay=${media.playing ? 1 : 0}&mute=${media.muted ? 1 : 0}&enablejsapi=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="${esc(
              media.title
            )}"></iframe></div>${promptOverlay(m)}`;
            ytFrame = layer.querySelector('iframe');
            audioEl = null;
          } else {
            layer.innerHTML = `
              <div class="audio-now">
                <span class="audio-eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                <span class="audio-now-text">
                  <b>${media.reveal ? 'Правильный ответ' : 'Звучит трек'}</b>
                  <span>${media.reveal ? 'Слушайте полную версию' : 'Слушайте и угадывайте'}</span>
                </span>
                <audio src="${esc(media.localUrl)}" ${media.playing ? 'autoplay' : ''} ${media.muted ? 'muted' : ''}></audio>
              </div>`;
            audioEl = layer.querySelector('audio');
            if (media.playing) playAudio();
            ytFrame = null;
          }
          lastRestartToken = media.restartToken ?? 0;
        } else if ((media.restartToken ?? 0) !== lastRestartToken) {
          lastRestartToken = media.restartToken ?? 0;
          if (media.source === 'youtube' && ytFrame) {
            ytFrame.contentWindow.postMessage(
              JSON.stringify({ event: 'command', func: 'seekTo', args: [0, true] }),
              '*'
            );
            ytFrame.contentWindow.postMessage(
              JSON.stringify({ event: 'command', func: 'playVideo', args: [] }),
              '*'
            );
          } else if (media.source === 'local' && audioEl) {
            audioEl.currentTime = 0;
            audioEl.play().catch(() => {});
          }
        } else if (media.source === 'youtube' && ytFrame) {
          ytFrame.contentWindow.postMessage(
            JSON.stringify({ event: 'command', func: media.playing ? 'playVideo' : 'pauseVideo', args: [] }),
            '*'
          );
        } else if (media.source === 'local' && audioEl) {
          if (media.playing) audioEl.play().catch(() => {});
          else audioEl.pause();
        }
      }

      const modeLabel = (mode) => (mode === 'teams' ? 'Команды' : 'Каждый сам за себя');

      function render(m) {
        const stage = el('stage');
        const drawCanvas = el('draw-canvas');
        drawCanvas.classList.add('hidden');
        stage.classList.toggle('stage-drawing', m.phase === 'round' && m.experiment && m.experiment.kind === 'drawing');
        if (m.phase === 'lobby') {
          stage.innerHTML = `
            <div class="deck">
              <div class="card join-card">
                <div class="label">Код для входа</div>
                <div class="code">${esc(m.code)}</div>
                <img class="qr" src="/api/qr.png" alt="QR-код для входа" />
                <div class="hint">Отсканируй QR или открой ${esc(joinUrl)}</div>
              </div>
              <div class="card">
                <div class="lobby-head">
                  <h2>В игре</h2>
                  <span class="pill">${modeLabel(m.mode)}</span>
                </div>
                <ul class="players">
                  ${m.participants.map((p) => `<li>${esc(p.name)}</li>`).join('')}
                </ul>
                ${m.participants.length ? '' : '<div class="empty">Пока никого. Отсканируй QR с телефона.</div>'}
              </div>
            </div>`;
          return;
        }

        if (m.phase === 'experiment') {
          stage.innerHTML = `
            <div class="card center-card">
              <div class="label">Эксперимент</div>
              <h2 class="experiment-name">${esc(m.experiment.name)}</h2>
              <p class="rules">${esc(m.experiment.rules)}</p>
              <div class="hint">Приготовьтесь: ведущий запускает первый раунд.</div>
            </div>`;
          return;
        }

        if (m.phase === 'round') {
          if (m.experiment && m.experiment.kind === 'drawing') {
            drawCanvas.classList.remove('hidden');
            const drawer = m.participants.find((p) => p.id === m.drawerId);
            stage.innerHTML = `
              <div class="round">
                <div class="round-head">
                  <span class="pill">Раунд ${m.round.index + 1} / ${m.round.total}</span>
                  <span class="answers-count">Ответов: ${m.answersCount}</span>
                </div>
                <div class="round-body round-body-drawing">
                  ${m.round.data.hint ? `<div class="hint-banner">Подсказка: ${esc(m.round.data.hint)}</div>` : ''}
                  <div class="hint">Рисует: ${esc(drawer ? drawer.name : '—')}. Угадывайте название песни на пультах.</div>
                </div>
              </div>`;
            redrawCanvas(drawCanvas, m.drawing);
            return;
          }
          stage.innerHTML = `
            <div class="round">
              <div class="round-head">
                <span class="pill">Раунд ${m.round.index + 1} / ${m.round.total}</span>
                <span class="answers-count">Ответов: ${m.answersCount}</span>
              </div>
              <div class="round-body">
                ${m.round.data.hint ? `<div class="hint-banner">Подсказка: ${esc(m.round.data.hint)}</div>` : ''}
                ${m.round.data.quote ? `<blockquote class="round-quote">«${esc(m.round.data.quote)}»</blockquote>` : ''}
                ${m.round.data.prompt ? `<h2 class="round-prompt">${esc(m.round.data.prompt)}</h2>` : ''}
                ${m.round.data.text ? `<p class="round-text">${esc(m.round.data.text)}</p>` : ''}
                ${m.round.data.image ? `<div class="collage"><img src="${esc(m.round.data.image)}" alt="Коллаж" /></div>` : ''}
              </div>
              <div class="round-foot">
                <span class="hint">${m.round.data.options ? 'Выберите ответ на пульте. Кто быстрее — тому бонус.' : 'Введите ответ на пульте. Кто быстрее — тому бонус.'}</span>
              </div>
            </div>`;
          return;
        }

        if (m.phase === 'reveal') {
          stage.innerHTML = `
            <div class="round">
              <div class="round-head"><span class="pill">Правильный ответ</span></div>
              <div class="round-body">
                <h2 class="answer">${esc(m.reveal.answer)}</h2>
                <ul class="results">
                  ${m.reveal.results
                    .map(
                      (r) => `<li class="result ${r.correct ? 'correct' : 'wrong'}">
                        <span class="rname">${esc(r.name)}</span>
                        <span class="rvalue">${r.value ? esc(r.value) : '—'}</span>
                        <span class="rpoints">${r.correct ? '+' + r.points : '0'}</span>
                      </li>`
                    )
                    .join('')}
                </ul>
                <div class="totals">
                  ${[...m.participants]
                    .sort((a, b) => b.score - a.score)
                    .map((p) => `<span class="total"><span>${esc(p.name)}</span><b>${p.score}</b></span>`)
                    .join('')}
                </div>
              </div>
            </div>`;
          return;
        }

        if (m.phase === 'winner') {
          const w = m.winner;
          stage.innerHTML = `<div class="card center-card">
            <div class="label">Победитель партии</div>
            <h2 class="answer">${esc(w ? w.name : '—')}</h2>
            <div class="hint">${w ? w.score + ' балл(ов)' : ''}</div>
          </div>`;
          return;
        }

        if (m.phase === 'results') {
          const sorted = [...m.participants].sort((a, b) => b.score - a.score);
          stage.innerHTML = `
            <div class="card center-card">
              <div class="label">Итоги эксперимента</div>
              <ol class="standings">
                ${sorted
                  .map(
                    (p, i) => `<li>
                      <span class="pos">${i + 1}</span>
                      <span class="sname">${esc(p.name)}</span>
                      <span class="spoints">${p.score}</span>
                    </li>`
                  )
                  .join('')}
              </ol>
              <div class="hint">Ведущий вернёт всех в лобби.</div>
            </div>`;
        }
      }
    </script>
  </body>
</html>
