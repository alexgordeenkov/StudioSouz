<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Музыкальные игры — общий экран</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="wide">
    <header class="brand">
      <span class="dot"></span>
      <h1>Музыкальные игры у Машеньки и Лёшика</h1>
    </header>

    <main id="stage" class="stage"></main>
    <canvas id="draw-canvas" class="draw-canvas hidden" width="900" height="620"></canvas>
    <div id="media" class="media-layer"></div>

    <script type="module">
      import { el, esc, connect, loadConfig, drawStroke, redrawCanvas } from '/client.js';

      let joinUrl = '';
      let state = null;

      loadConfig().then((cfg) => {
        joinUrl = cfg.joinUrl;
        if (state) render(state);
      });

      connect('screen', {
        state: (m) => {
          state = m;
          render(m);
          renderMedia(m);
        },
        draw: (m) => {
          const canvas = el('draw-canvas');
          if (!canvas.classList.contains('hidden')) drawStroke(canvas.getContext('2d'), canvas, m.stroke);
        },
        canvas: (m) => {
          redrawCanvas(el('draw-canvas'), m.strokes);
        },
      });

      let mediaKey = null;
      let ytFrame = null;
      let audioEl = null;

      function promptOverlay(m) {
        const prompt = m.round && m.round.data && m.round.data.prompt;
        return prompt ? `<div class="media-prompt">${esc(prompt)}</div>` : '';
      }

      function renderMedia(m) {
        const layer = el('media');
        const media = m.media;
        if (!media) {
          layer.classList.remove('active');
          if (mediaKey) {
            layer.innerHTML = '';
            mediaKey = null;
            ytFrame = null;
            audioEl = null;
          }
          return;
        }
        layer.classList.add('active');
        const key = media.source + ':' + (media.youtubeId || media.localUrl);
        if (key !== mediaKey) {
          mediaKey = key;
          if (media.source === 'youtube') {
            layer.innerHTML = `<div class="media-frame"><iframe src="https://www.youtube.com/embed/${encodeURIComponent(
              media.youtubeId
            )}?autoplay=${media.playing ? 1 : 0}&mute=${media.muted ? 1 : 0}&enablejsapi=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="${esc(
              media.title
            )}"></iframe></div>${promptOverlay(m)}`;
            ytFrame = layer.querySelector('iframe');
            audioEl = null;
          } else {
            layer.innerHTML = `<div class="media-frame audio-frame"><audio src="${esc(
              media.localUrl
            )}" ${media.playing ? 'autoplay' : ''} ${media.muted ? 'muted' : ''} controls></audio></div>${promptOverlay(m)}`;
            audioEl = layer.querySelector('audio');
            ytFrame = null;
          }
        } else if (media.source === 'youtube' && ytFrame) {
          ytFrame.contentWindow.postMessage(
            JSON.stringify({ event: 'command', func: media.playing ? 'playVideo' : 'pauseVideo', args: [] }),
            '*'
          );
        } else if (media.source === 'local' && audioEl) {
          if (media.playing) audioEl.play().catch(() => {});
          else audioEl.pause();
        }
      }

      const modeLabel = (mode) => (mode === 'teams' ? 'Команды' : 'Каждый сам за себя');

      function render(m) {
        const stage = el('stage');
        const drawCanvas = el('draw-canvas');
        drawCanvas.classList.add('hidden');
        if (m.phase === 'lobby') {
          stage.innerHTML = `
            <div class="deck">
              <div class="card join-card">
                <div class="label">Код для входа</div>
                <div class="code">${esc(m.code)}</div>
                <img class="qr" src="/api/qr.png" alt="QR-код для входа" />
                <div class="hint">Отсканируй QR или открой ${esc(joinUrl)}</div>
              </div>
              <div class="card">
                <div class="lobby-head">
                  <h2>В игре</h2>
                  <span class="pill">${modeLabel(m.mode)}</span>
                </div>
                <ul class="players">
                  ${m.participants.map((p) => `<li>${esc(p.name)}</li>`).join('')}
                </ul>
                ${m.participants.length ? '' : '<div class="empty">Пока никого. Отсканируй QR с телефона.</div>'}
              </div>
            </div>`;
          return;
        }

        if (m.phase === 'experiment') {
          stage.innerHTML = `
            <div class="card center-card">
              <div class="label">Эксперимент</div>
              <h2 class="experiment-name">${esc(m.experiment.name)}</h2>
              <p class="rules">${esc(m.experiment.rules)}</p>
              <div class="hint">Приготовьтесь: ведущий запускает первый раунд.</div>
            </div>`;
          return;
        }

        if (m.phase === 'round') {
          if (m.experiment && m.experiment.kind === 'drawing') {
            drawCanvas.classList.remove('hidden');
            const drawer = m.participants.find((p) => p.id === m.drawerId);
            stage.innerHTML = `
              <div class="round">
                <div class="round-head">
                  <span class="pill">Раунд ${m.round.index + 1} / ${m.round.total}</span>
                  <span class="answers-count">Ответов: ${m.answersCount}</span>
                </div>
                <div class="hint">Рисует: ${esc(drawer ? drawer.name : '—')}. Угадывайте название песни на пультах.</div>
              </div>`;
            redrawCanvas(drawCanvas, m.drawing);
            return;
          }
          stage.innerHTML = `
            <div class="round">
              <div class="round-head">
                <span class="pill">Раунд ${m.round.index + 1} / ${m.round.total}</span>
                <span class="answers-count">Ответов: ${m.answersCount}</span>
              </div>
              ${m.round.data.quote ? `<blockquote class="round-quote">«${esc(m.round.data.quote)}»</blockquote>` : ''}
              ${m.round.data.prompt ? `<h2 class="round-prompt">${esc(m.round.data.prompt)}</h2>` : ''}
              ${m.round.data.text ? `<p class="round-text">${esc(m.round.data.text)}</p>` : ''}
              ${m.round.data.image ? `<div class="collage"><img src="${esc(m.round.data.image)}" alt="Коллаж" /></div>` : ''}
              <div class="hint">${m.round.data.options ? 'Выберите ответ на пульте. Кто быстрее — тому бонус.' : 'Введите ответ на пульте. Кто быстрее — тому бонус.'}</div>
            </div>`;
          return;
        }

        if (m.phase === 'reveal') {
          stage.innerHTML = `
            <div class="round">
              <div class="round-head"><span class="pill">Правильный ответ</span></div>
              <h2 class="answer">${esc(m.reveal.answer)}</h2>
              <ul class="results">
                ${m.reveal.results
                  .map(
                    (r) => `<li class="result ${r.correct ? 'correct' : 'wrong'}">
                      <span class="rname">${esc(r.name)}</span>
                      <span class="rvalue">${r.value ? esc(r.value) : '—'}</span>
                      <span class="rpoints">${r.correct ? '+' + r.points : '0'}</span>
                    </li>`
                  )
                  .join('')}
              </ul>
              <div class="totals">
                ${[...m.participants]
                  .sort((a, b) => b.score - a.score)
                  .map((p) => `<span class="total"><span>${esc(p.name)}</span><b>${p.score}</b></span>`)
                  .join('')}
              </div>
            </div>`;
          return;
        }

        if (m.phase === 'winner') {
          const w = m.winner;
          stage.innerHTML = `<div class="card center-card">
            <div class="label">Победитель партии</div>
            <h2 class="answer">${esc(w ? w.name : '—')}</h2>
            <div class="hint">${w ? w.score + ' балл(ов)' : ''}</div>
          </div>`;
          return;
        }

        if (m.phase === 'results') {
          const sorted = [...m.participants].sort((a, b) => b.score - a.score);
          stage.innerHTML = `
            <div class="card center-card">
              <div class="label">Итоги эксперимента</div>
              <ol class="standings">
                ${sorted
                  .map(
                    (p, i) => `<li>
                      <span class="pos">${i + 1}</span>
                      <span class="sname">${esc(p.name)}</span>
                      <span class="spoints">${p.score}</span>
                    </li>`
                  )
                  .join('')}
              </ol>
              <div class="hint">Ведущий вернёт всех в лобби.</div>
            </div>`;
        }
      }
    </script>
  </body>
</html>
